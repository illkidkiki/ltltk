<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurring Budget Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        :root { --bg: #FAFAFA; --surface: #ffffff; --surface2: #f5f5f5; --text: #3E3E3E; --muted: #7a7a7a; --divider: #e4e4e4; --primary: #8C6A4E; --success: #A7B6A2; --warning: #D9A066; --error: #a56a4a; --radius: 18px; --shadow: 0 10px 24px rgba(62,62,62,.08); }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
        .side { padding: 24px; border-right: 1px solid var(--divider); background: var(--surface); }
        .main { padding: 24px; display: grid; gap: 18px; }
        .card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
        .chartbox { min-height: 280px; background: var(--surface2); border-radius: 16px; padding: 12px; }
        button { padding: 12px 14px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
        button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--divider); }
    </style>
</head>
<body>
    <div class="app">
        <aside class="side">
            <h1>Budget Tracker</h1>
            <div id="lastSaved" style="margin-top:8px; font-size:13px; color:var(--muted);"></div>
        </aside>
        <main class="main">
            <!-- 你的原始表格和圖表內容保留在這裡 -->
            <div id="categoryChartContainer" class="chartbox"><canvas id="categoryChart"></canvas></div>
            <div id="dailyChartContainer" class="chartbox"><canvas id="dailyChart"></canvas></div>
            <table id="expenseTable"><thead><tr><th>日期</th><th>類別</th><th>金額</th></tr></thead><tbody id="expenseTableBody"></tbody></table>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLLSn0irqFZl6QRxvO7q0UyWawWJhRBNA",
            authDomain: "budget-tracker-5719f.firebaseapp.com",
            projectId: "budget-tracker-5719f",
            storageBucket: "budget-tracker-5719f.firebasestorage.app",
            messagingSenderId: "304444847886",
            appId: "1:304444847886:web:671050f5eb75eb50e9c95f",
            measurementId: "G-Y0E3S3YBRS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // 整合儲存邏輯
        window.saveState = async function() {
            // 原有的 localStorage
            localStorage.setItem("budget-tracker-recurring-v6", JSON.stringify({
                expenses: window.state.expenses,
                current: window.state.current
            }));
            
            // 同步到 Firebase
            try {
                await setDoc(doc(db, "budget", "data"), {
                    expenses: window.state.expenses,
                    current: window.state.current,
                    budgets: window.state.budgets
                });
                document.getElementById('lastSaved').textContent = '已同步至雲端：' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error("Firebase 同步失敗: ", e);
            }
        };

        window.loadState = async function() {
            // 先嘗試讀取 Firebase
            try {
                const docSnap = await getDoc(doc(db, "budget", "data"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.state.expenses = data.expenses || [];
                    window.state.current = data.current || window.state.current;
                    window.state.budgets = data.budgets || window.state.budgets;
                    if(typeof window.renderAll === 'function') window.renderAll();
                    console.log("Firebase: 資料讀取成功！");
                    return;
                }
            } catch (e) {
                console.error("Firebase 讀取失敗: ", e);
            }
            // 如果讀不到，才讀 localStorage
            const raw = localStorage.getItem("budget-tracker-recurring-v6");
            if(raw) {
                const x = JSON.parse(raw);
                window.state.expenses = x.expenses;
                window.state.current = x.current;
                if(typeof window.renderAll === 'function') window.renderAll();
            }
        };
        
        // 頁面加載時執行
        window.loadState();
    </script>
</body>
</html>
